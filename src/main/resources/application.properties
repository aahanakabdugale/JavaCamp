# ===================================================================
# 1. SERVER CONFIGURATION
# ===================================================================
# Port where your Spring Boot app will run
server.port=8080 

# ===================================================================
# 2. MYSQL DATABASE CONNECTION
# ===================================================================
# JDBC URL format: jdbc:mysql://<HOST>:<PORT>/<DATABASE_NAME>
# Replace 'my_database_name' with your actual MySQL database name
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true 

# MySQL credentials
spring.datasource.username=ecommerce_user 
spring.datasource.password=EcommercePassword123! 

# MySQL Driver class name
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver 

# ===================================================================
# 3. SPRING DATA JPA & HIBERNATE CONFIGURATION
# ===================================================================
# DDL Strategy: Automatically creates/updates DB tables based on Java @Entity
classes
# Options: update, create, create-drop, validate, none
spring.jpa.hibernate.ddl-auto=update 

# Database Dialect for MySQL 
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect 

# Converts Java camelCase fields (e.g. productName) to SQL snake_case
(product_name)
spring.jpa.hibernate.naming.physical
strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy 

# ===================================================================
# 4. SQL QUERY LOGGING (Helpful for Debugging)
# ===================================================================
# Prints the generated SQL queries in the IntelliJ/Eclipse console
spring.jpa.show-sql=true 

# Formats the printed SQL nicely so it's readable
spring.jpa.properties.hibernate.format_sql=true spring.application.name=ecommerceproduct
